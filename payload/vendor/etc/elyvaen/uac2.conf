# Elyvaen UAC2 configuration.
# Read by elyvaen-usb (gadget helper) and elyvaen-uac2d (audio bridge).
# Lives in /vendor/etc so both vendor domains can read it.
# Initial/fallback rate. The host selects the real UAC2 rate;
# elyvaen-uac2d follows UAC2 Capture Rate automatically.
rate=48000
channels=2
# FIFO -> AudioTrack bridge. uac2d captures the UAC2 gadget and writes
# float32/48 kHz to this FIFO; the ElyvaenUac2 app plays it through the
# Android audio HAL (the path that already routes correctly to the jack).
output=fifo
fifo=/data/local/tmp/elyvaen_uac2.pcm
rate_file=/data/local/tmp/elyvaen_uac2.rate
mode_file=/data/local/tmp/elyvaen_uac2.mode
status_file=/data/local/tmp/elyvaen_uac2.status
# 0 = native host rate (44.1/48/96/192); >0 forces that output rate.
out_rate=0
periods=4
prefill_periods=2
period_frames=0
capture_device=0
playback_device=0
capture_format=s24_3le
playback_format=s24_3le

# Gadget helper. The UDC is normally discovered from the bound gadget;
# this is the fallback if the gadget is unbound when the helper starts.
req_number=4
auto=1
poll_ms=2500
heal_max=3
udc=4e00000.dwc3
